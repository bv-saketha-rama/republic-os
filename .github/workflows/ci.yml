name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['data/**']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm exec vite build
        env:
          VITE_CONVEX_URL: https://placeholder.convex.cloud
