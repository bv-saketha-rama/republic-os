name: Fetch Lok Sabha Bills

on:
  schedule:
    # Daily at 2:30 AM UTC (8 AM IST) — after Lok Sabha morning session
    - cron: '30 2 * * *'
  workflow_dispatch: # allow manual trigger from GitHub Actions tab

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Fetch bills from Lok Sabha API
        run: |
          fetch() { # url outfile
            curl -fsSL --retry 3 --retry-delay 5 --max-time 60 \
              -H "Accept: application/json" \
              -H "User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36" \
              "$1" -o "$2"
          }
          fetch "https://loksabhaapp.sansad.in/ws/bills?HouseType=L&PageNo=1&PageSize=100" data/bills_raw.json
          fetch "https://loksabhaapp.sansad.in/ws/bills?HouseType=R&PageNo=1&PageSize=100" data/bills_rs_raw.json
          fetch "https://loksabhaapp.sansad.in/ws/members?HouseType=L&PageNo=1&PageSize=600" data/members_raw.json

      - name: Normalise and validate
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const read = (f) => JSON.parse(fs.readFileSync(f, 'utf8'));
          const list = (o, keys) => Array.isArray(o) ? o : (keys.map(k => o?.[k]).find(Array.isArray) ?? []);
          const tag = (arr, House) => arr.map(b => ({ ...b, House }));
          const ls = tag(list(read('data/bills_raw.json'), ['BillList', 'bills', 'data']), 'L');
          const rs = tag(list(read('data/bills_rs_raw.json'), ['BillList', 'bills', 'data']), 'R');
          const members = list(read('data/members_raw.json'), ['Members', 'members', 'data']);
          const bills = [...ls, ...rs];
          if (bills.length === 0 || members.length === 0) {
            console.error(`Empty result (bills=${bills.length}, members=${members.length}); API shape may have changed. Raw head:`);
            console.error(fs.readFileSync('data/bills_raw.json', 'utf8').slice(0, 500));
            process.exit(1);
          }
          // No timestamp: keep output stable so unchanged data produces no commit.
          fs.writeFileSync('data/bills.json', JSON.stringify({ count: bills.length, bills }, null, 2));
          fs.writeFileSync('data/members.json', JSON.stringify({ count: members.length, Members: members }, null, 2));
          console.log(`Wrote ${bills.length} bills and ${members.length} members`);
          EOF
          rm -f data/bills_raw.json data/bills_rs_raw.json data/members_raw.json

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/bills.json data/members.json
          git diff --cached --quiet || git commit -m "chore: update Lok Sabha bills and members data [skip ci]"
          git push
